services:
  scan-bridge:
    build:
      context: .
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    # SANE discovery uses multicast/broadcast packets that Docker's default
    # bridge network does not forward. The supported deployment target is Linux.
    network_mode: host
    environment:
      Persistence__ConnectionString: Data Source=/app/data/bridge.db
      TemporaryStorage__Path: /app/temp
      DataProtectionStorage__Path: /app/data/dataprotection-keys
      Paperless__BaseUrl: ${PAPERLESS_URL:-http://paperless:8000}
      Paperless__ApiToken: ${PAPERLESS_TOKEN:-}
      Paperless__TimeoutSeconds: ${PAPERLESS_TIMEOUT_SECONDS:-60}
      Scanner__DeviceId: ${SCANNER_DEVICE_ID:-}
      Scanner__TimeoutSeconds: ${SCANNER_TIMEOUT_SECONDS:-30}
      Scanner__ScanTimeoutSeconds: ${SCANNER_SCAN_TIMEOUT_SECONDS:-120}
      Scanner__MaximumScanDurationSeconds: ${SCANNER_MAXIMUM_SCAN_DURATION_SECONDS:-14400}
      ScannerDiscovery__SaneConfigurationDirectory: /app/data/sane.d
    volumes:
      - ./app/data:/app/data
      - ./app/temp:/app/temp
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped
