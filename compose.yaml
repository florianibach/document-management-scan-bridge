services:
  scan-bridge:
    build:
      context: .
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    # SANE discovery uses multicast/broadcast packets that Docker's default
    # bridge network does not forward. The supported deployment target is Linux.
    network_mode: host
    environment:
      APPLICATION_HTTP_PORT: ${APPLICATION_HTTP_PORT:-8080}
      Persistence__ConnectionString: Data Source=/app/data/bridge.db
      TemporaryStorage__Path: /app/temp
      DataProtectionStorage__Path: /app/data/dataprotection-keys
      Paperless__BaseUrl: ${PAPERLESS_URL:-http://paperless:8000}
      Paperless__ApiToken: ${PAPERLESS_TOKEN:-}
      Paperless__TimeoutSeconds: ${PAPERLESS_TIMEOUT_SECONDS:-60}
      Paperless__ShowHttpWarning: ${PAPERLESS_SHOW_HTTP_WARNING:-true}
      Scanner__DeviceId: ${SCANNER_DEVICE_ID:-}
      Scanner__TimeoutSeconds: ${SCANNER_TIMEOUT_SECONDS:-30}
      Scanner__ScanTimeoutSeconds: ${SCANNER_SCAN_TIMEOUT_SECONDS:-120}
      Scanner__MaximumScanDurationSeconds: ${SCANNER_MAXIMUM_SCAN_DURATION_SECONDS:-14400}
      ScannerDiscovery__SaneConfigurationDirectory: /app/data/sane.d
      Profiles__Mode: ${PROFILE_MODE:-Anonymous}
      Profiles__AnonymousSubject: ${PROFILE_ANONYMOUS_SUBJECT:-scan-bridge-local-anonymous-profile}
      Profiles__LegacyDefaultsMigration: ${PROFILE_LEGACY_DEFAULTS_MIGRATION:-MoveToAnonymous}
      Profiles__RemoteSignOutUrl: ${PROFILE_REMOTE_SIGNOUT_URL:-}
      ProfileServices__AllowProfileUrlOverride: ${PROFILE_ALLOW_PAPERLESS_URL_OVERRIDE:-true}
      ProfileServices__AllowDeploymentTokenFallback: ${PROFILE_ALLOW_DEPLOYMENT_TOKEN_FALLBACK:-false}
      Authentication__Oidc__Authority: ${OIDC_AUTHORITY:-}
      Authentication__Oidc__ClientId: ${OIDC_CLIENT_ID:-}
      Authentication__Oidc__ClientSecret: ${OIDC_CLIENT_SECRET:-}
      Authentication__Oidc__SignedOutCallbackPath: /signout-callback-oidc
    volumes:
      - ./app/data:/app/data
      - ./app/temp:/app/temp
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:${APPLICATION_HTTP_PORT:-8080}/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped
